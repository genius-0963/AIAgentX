apiVersion: v1
kind: ServiceAccount
metadata:
  name: aiagentx-api
  namespace: aiagentx
  labels:
    app.kubernetes.io/name: aiagentx
    app.kubernetes.io/component: api
    app.kubernetes.io/part-of: aiagentx-platform
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: aiagentx-worker
  namespace: aiagentx
  labels:
    app.kubernetes.io/name: aiagentx
    app.kubernetes.io/component: worker
    app.kubernetes.io/part-of: aiagentx-platform
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: aiagentx-api-role
  namespace: aiagentx
  labels:
    app.kubernetes.io/name: aiagentx
    app.kubernetes.io/component: api
    app.kubernetes.io/part-of: aiagentx-platform
rules:
  - apiGroups: [""]
    resources: ["configmaps", "secrets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: aiagentx-api-rolebinding
  namespace: aiagentx
  labels:
    app.kubernetes.io/name: aiagentx
    app.kubernetes.io/component: api
    app.kubernetes.io/part-of: aiagentx-platform
subjects:
  - kind: ServiceAccount
    name: aiagentx-api
    namespace: aiagentx
roleRef:
  kind: Role
  name: aiagentx-api-role
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: aiagentx-worker-role
  namespace: aiagentx
  labels:
    app.kubernetes.io/name: aiagentx
    app.kubernetes.io/component: worker
    app.kubernetes.io/part-of: aiagentx-platform
rules:
  - apiGroups: [""]
    resources: ["configmaps", "secrets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: aiagentx-worker-rolebinding
  namespace: aiagentx
  labels:
    app.kubernetes.io/name: aiagentx
    app.kubernetes.io/component: worker
    app.kubernetes.io/part-of: aiagentx-platform
subjects:
  - kind: ServiceAccount
    name: aiagentx-worker
    namespace: aiagentx
roleRef:
  kind: Role
  name: aiagentx-worker-role
  apiGroup: rbac.authorization.k8s.io