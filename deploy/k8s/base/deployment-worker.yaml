apiVersion: apps/v1
kind: Deployment
metadata:
  name: aiagentx-worker
  namespace: aiagentx
  labels:
    app.kubernetes.io/name: aiagentx
    app.kubernetes.io/component: worker
    app.kubernetes.io/version: "0.1.0"
    app.kubernetes.io/part-of: aiagentx-platform
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: aiagentx
      app.kubernetes.io/component: worker
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: aiagentx
        app.kubernetes.io/component: worker
        app.kubernetes.io/version: "0.1.0"
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9090"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: aiagentx-worker
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: wait-for-db
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              until nc -z postgres 5432; do
                echo "Waiting for database..."
                sleep 2
              done
              echo "Database is ready!"
          resources:
            requests:
              cpu: "10m"
              memory: "10Mi"
            limits:
              cpu: "50m"
              memory: "20Mi"
        - name: wait-for-redis
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              until nc -z redis 6379; do
                echo "Waiting for Redis..."
                sleep 2
              done
              echo "Redis is ready!"
          resources:
            requests:
              cpu: "10m"
              memory: "10Mi"
            limits:
              cpu: "50m"
              memory: "20Mi"
      containers:
        - name: worker
          image: aiagentx/worker:0.1.0
          imagePullPolicy: IfNotPresent
          command:
            - python
            - -m
            - dramatiq
            - app.workers.executor
            - --processes
            - "2"
            - --threads
            - "4"
          envFrom:
            - configMapRef:
                name: aiagentx-config
            - secretRef:
                name: aiagentx-secrets
          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"
            limits:
              cpu: "4000m"
              memory: "4Gi"
          livenessProbe:
            exec:
              command:
                - python
                - -c
                - |
                  import redis
                  import sys
                  r = redis.from_url("redis://redis:6379/0")
                  r.ping()
                  sys.exit(0)
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          readinessProbe:
            exec:
              command:
                - python
                - -c
                - |
                  import redis
                  import sys
                  r = redis.from_url("redis://redis:6379/0")
                  r.ping()
                  sys.exit(0)
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          lifecycle:
            preStop:
              exec:
                command:
                  - sh
                  - -c
                  - "sleep 30"
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app.kubernetes.io/component
                      operator: In
                      values:
                        - worker
                topologyKey: kubernetes.io/hostname
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/component: worker