apiVersion: v1
kind: Service
metadata:
  name: aiagentx-api
  namespace: aiagentx
  labels:
    app.kubernetes.io/name: aiagentx
    app.kubernetes.io/component: api
    app.kubernetes.io/part-of: aiagentx-platform
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
    - name: metrics
      port: 9090
      targetPort: metrics
      protocol: TCP
  selector:
    app.kubernetes.io/name: aiagentx
    app.kubernetes.io/component: api
---
apiVersion: v1
kind: Service
metadata:
  name: aiagentx-worker
  namespace: aiagentx
  labels:
    app.kubernetes.io/name: aiagentx
    app.kubernetes.io/component: worker
    app.kubernetes.io/part-of: aiagentx-platform
spec:
  type: ClusterIP
  ports:
    - name: metrics
      port: 9090
      targetPort: metrics
      protocol: TCP
  selector:
    app.kubernetes.io/name: aiagentx
    app.kubernetes.io/component: worker
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: aiagentx
  labels:
    app.kubernetes.io/name: aiagentx
    app.kubernetes.io/component: database
    app.kubernetes.io/part-of: aiagentx-platform
spec:
  type: ClusterIP
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
      protocol: TCP
  selector:
    app.kubernetes.io/name: postgres
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: aiagentx
  labels:
    app.kubernetes.io/name: aiagentx
    app.kubernetes.io/component: cache
    app.kubernetes.io/part-of: aiagentx-platform
spec:
  type: ClusterIP
  ports:
    - name: redis
      port: 6379
      targetPort: 6379
      protocol: TCP
  selector:
    app.kubernetes.io/name: redis
---
apiVersion: v1
kind: Service
metadata:
  name: otel-collector
  namespace: aiagentx
  labels:
    app.kubernetes.io/name: aiagentx
    app.kubernetes.io/component: observability
    app.kubernetes.io/part-of: aiagentx-platform
spec:
  type: ClusterIP
  ports:
    - name: otlp-grpc
      port: 4317
      targetPort: 4317
      protocol: TCP
    - name: otlp-http
      port: 4318
      targetPort: 4318
      protocol: TCP
  selector:
    app.kubernetes.io/name: otel-collector