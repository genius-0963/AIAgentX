version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    container_name: aiagentx-postgres
    environment:
      POSTGRES_USER: aiagentx
      POSTGRES_PASSWORD: aiagentx
      POSTGRES_DB: aiagentx
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aiagentx -d aiagentx"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - aiagentx-network

  redis:
    image: redis:7-alpine
    container_name: aiagentx-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - aiagentx-network

volumes:
  postgres_data:
  redis_data:

networks:
  aiagentx-network:
    driver: bridge