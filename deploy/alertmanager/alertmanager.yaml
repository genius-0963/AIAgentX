global:
  resolve_timeout: 5m
  smtp_smarthost: 'smtp.gmail.com:587'
  smtp_from: 'alerts@aiagentx.io'
  smtp_auth_username: 'alerts@aiagentx.io'
  smtp_auth_password: '${SMTP_PASSWORD}'
  smtp_require_tls: true

  # Slack webhook URL (set via environment variable)
  slack_api_url: '${SLACK_WEBHOOK_URL}'

  # PagerDuty integration key (set via environment variable)
  pagerduty_url: 'https://events.pagerduty.com/v2/enqueue'
  pagerduty_routing_key: '${PAGERDUTY_KEY}'

  # Opsgenie API key (set via environment variable)
  opsgenie_api_key: '${OPSGENIE_API_KEY}'
  opsgenie_api_url: 'https://api.opsgenie.com/'

route:
  group_by: ['alertname', 'component', 'severity']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  receiver: 'default'
  routes:
    # Critical alerts - immediate notification
    - match:
        severity: critical
      receiver: 'critical-alerts'
      continue: true

    # Warning alerts - batched notification
    - match:
        severity: warning
      receiver: 'warning-alerts'
      continue: true

    # Component-specific routes
    - match:
        component: api
      receiver: 'api-team'
      continue: true

    - match:
        component: worker
      receiver: 'worker-team'
      continue: true

    - match:
        component: provider
      receiver: 'provider-team'
      continue: true

    - match:
        component: database
      receiver: 'db-team'
      continue: true

    - match:
        component: infrastructure
      receiver: 'infra-team'
      continue: true

    # Suppress flapping alerts
    - match:
        alertname: 'Watchdog'
      receiver: 'null'

receivers:
  # Default receiver - sends to Slack and email
  - name: 'default'
    slack_configs:
      - api_url: '${SLACK_WEBHOOK_URL}'
        channel: '#aiagentx-alerts'
        title: 'AIAgentX Alert: {{ .GroupLabels.alertname }}'
        text: |
          {{ range .Alerts }}
          *Alert:* {{ .Labels.alertname }}
          *Severity:* {{ .Labels.severity }}
          *Component:* {{ .Labels.component }}
          *Summary:* {{ .Annotations.summary }}
          *Description:* {{ .Annotations.description }}
          *Runbook:* {{ .Annotations.runbook_url }}
          {{ end }}
        send_resolved: true
        icon_emoji: ':warning:'
        username: 'AIAgentX AlertManager'
    email_configs:
      - to: 'oncall@aiagentx.io'
        send_resolved: true
        headers:
          subject: '[AIAgentX] {{ .GroupLabels.alertname }} - {{ .GroupLabels.severity }}'

  # Critical alerts - immediate PagerDuty + Slack + Email
  - name: 'critical-alerts'
    pagerduty_configs:
      - routing_key: '${PAGERDUTY_KEY}'
        severity: critical
        description: '{{ .GroupLabels.alertname }} - {{ .GroupLabels.component }}'
        details:
          summary: '{{ .CommonAnnotations.summary }}'
          description: '{{ .CommonAnnotations.description }}'
          runbook: '{{ .CommonAnnotations.runbook_url }}'
    slack_configs:
      - api_url: '${SLACK_WEBHOOK_URL}'
        channel: '#aiagentx-critical'
        title: '🚨 CRITICAL: {{ .GroupLabels.alertname }}'
        text: |
          {{ range .Alerts }}
          *Alert:* {{ .Labels.alertname }}
          *Component:* {{ .Labels.component }}
          *Summary:* {{ .Annotations.summary }}
          *Description:* {{ .Annotations.description }}
          *Runbook:* <{{ .Annotations.runbook_url }}|View Runbook>
          {{ end }}
        send_resolved: true
        icon_emoji: ':rotating_light:'
        username: 'AIAgentX Critical Alerts'
    email_configs:
      - to: 'oncall@aiagentx.io, engineering@aiagentx.io'
        send_resolved: true
        headers:
          subject: '[CRITICAL] AIAgentX: {{ .GroupLabels.alertname }}'

  # Warning alerts - Slack only
  - name: 'warning-alerts'
    slack_configs:
      - api_url: '${SLACK_WEBHOOK_URL}'
        channel: '#aiagentx-warnings'
        title: '⚠️ WARNING: {{ .GroupLabels.alertname }}'
        text: |
          {{ range .Alerts }}
          *Alert:* {{ .Labels.alertname }}
          *Severity:* {{ .Labels.severity }}
          *Component:* {{ .Labels.component }}
          *Summary:* {{ .Annotations.summary }}
          *Description:* {{ .Annotations.description }}
          *Runbook:* <{{ .Annotations.runbook_url }}|View Runbook>
          {{ end }}
        send_resolved: true
        icon_emoji: ':warning:'
        username: 'AIAgentX Warnings'

  # API team receiver
  - name: 'api-team'
    slack_configs:
      - api_url: '${SLACK_WEBHOOK_URL}'
        channel: '#aiagentx-api'
        title: 'API Alert: {{ .GroupLabels.alertname }}'
        text: |
          {{ range .Alerts }}
          *Alert:* {{ .Labels.alertname }}
          *Severity:* {{ .Labels.severity }}
          *Summary:* {{ .Annotations.summary }}
          *Runbook:* <{{ .Annotations.runbook_url }}|View Runbook>
          {{ end }}
        send_resolved: true
    email_configs:
      - to: 'api-team@aiagentx.io'
        send_resolved: true

  # Worker team receiver
  - name: 'worker-team'
    slack_configs:
      - api_url: '${SLACK_WEBHOOK_URL}'
        channel: '#aiagentx-workers'
        title: 'Worker Alert: {{ .GroupLabels.alertname }}'
        text: |
          {{ range .Alerts }}
          *Alert:* {{ .Labels.alertname }}
          *Severity:* {{ .Labels.severity }}
          *Summary:* {{ .Annotations.summary }}
          *Runbook:* <{{ .Annotations.runbook_url }}|View Runbook>
          {{ end }}
        send_resolved: true
    email_configs:
      - to: 'worker-team@aiagentx.io'
        send_resolved: true

  # Provider team receiver
  - name: 'provider-team'
    slack_configs:
      - api_url: '${SLACK_WEBHOOK_URL}'
        channel: '#aiagentx-providers'
        title: 'Provider Alert: {{ .GroupLabels.alertname }}'
        text: |
          {{ range .Alerts }}
          *Alert:* {{ .Labels.alertname }}
          *Severity:* {{ .Labels.severity }}
          *Provider:* {{ .Labels.provider }}
          *Summary:* {{ .Annotations.summary }}
          *Runbook:* <{{ .Annotations.runbook_url }}|View Runbook>
          {{ end }}
        send_resolved: true

  # Database team receiver
  - name: 'db-team'
    slack_configs:
      - api_url: '${SLACK_WEBHOOK_URL}'
        channel: '#aiagentx-database'
        title: 'Database Alert: {{ .GroupLabels.alertname }}'
        text: |
          {{ range .Alerts }}
          *Alert:* {{ .Labels.alertname }}
          *Severity:* {{ .Labels.severity }}
          *Summary:* {{ .Annotations.summary }}
          *Runbook:* <{{ .Annotations.runbook_url }}|View Runbook>
          {{ end }}
        send_resolved: true
    email_configs:
      - to: 'db-team@aiagentx.io'
        send_resolved: true

  # Infrastructure team receiver
  - name: 'infra-team'
    slack_configs:
      - api_url: '${SLACK_WEBHOOK_URL}'
        channel: '#aiagentx-infra'
        title: 'Infrastructure Alert: {{ .GroupLabels.alertname }}'
        text: |
          {{ range .Alerts }}
          *Alert:* {{ .Labels.alertname }}
          *Severity:* {{ .Labels.severity }}
          *Summary:* {{ .Annotations.summary }}
          *Runbook:* <{{ .Annotations.runbook_url }}|View Runbook>
          {{ end }}
        send_resolved: true
    email_configs:
      - to: 'infra-team@aiagentx.io'
        send_resolved: true

  # Null receiver for suppressed alerts
  - name: 'null'

inhibit_rules:
  # Inhibit warning alerts if critical alert is firing for same component
  - source_match:
      severity: critical
    target_match:
      severity: warning
    equal: ['component', 'alertname']

  # Inhibit specific alerts if host is down
  - source_match:
      alertname: 'InstanceDown'
    target_match_re:
      alertname: '.*'
    equal: ['instance']

  # Inhibit worker alerts if API is down
  - source_match:
      alertname: 'APIDown'
    target_match:
      component: worker
    equal: ['namespace']

  # Inhibit provider alerts if API is down
  - source_match:
      alertname: 'APIDown'
    target_match:
      component: provider
    equal: ['namespace']

  # Inhibit database alerts if instance is down
  - source_match:
      alertname: 'InstanceDown'
    target_match:
      component: database
    equal: ['instance']

# Templates for custom formatting
templates:
  - '/etc/alertmanager/template/*.tmpl'