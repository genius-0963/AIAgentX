name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  PYTHON_VERSION: "3.12"
  POETRY_VERSION: "1.8.0"

jobs:
  lint-and-typecheck:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run Ruff (linting)
        run: ruff check .

      - name: Run Ruff (formatting)
        run: ruff format --check .

      - name: Run MyPy (type checking)
        run: mypy app

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: aiagentx
          POSTGRES_PASSWORD: aiagentx
          POSTGRES_DB: aiagentx
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aiagentx -d aiagentx"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Wait for services
        run: |
          sleep 5
          pg_isready -h localhost -p 5432 -U aiagentx -d aiagentx
          redis-cli -h localhost -p 6379 ping

      - name: Run database migrations
        env:
          DATABASE_URL: postgresql+psycopg://aiagentx:aiagentx@localhost:5432/aiagentx
          DATABASE_URL_SYNC: postgresql+psycopg://aiagentx:aiagentx@localhost:5432/aiagentx
          SECRET_KEY: test-secret-key-for-testing-only-do-not-use-in-prod
        run: |
          alembic upgrade head

      - name: Run tests
        env:
          DATABASE_URL: postgresql+asyncpg://aiagentx:aiagentx@localhost:5432/aiagentx
          REDIS_URL: redis://localhost:6379/0
          SECRET_KEY: test-secret-key-for-testing-only-do-not-use-in-prod
          APP_ENV: test
        run: |
          pytest tests/unit -v --tb=short

  integration-test:
    name: Integration Tests
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: aiagentx
          POSTGRES_PASSWORD: aiagentx
          POSTGRES_DB: aiagentx
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aiagentx -d aiagentx"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Wait for services
        run: |
          sleep 5
          pg_isready -h localhost -p 5432 -U aiagentx -d aiagentx
          redis-cli -h localhost -p 6379 ping

      - name: Run integration tests
        env:
          DATABASE_URL: postgresql+asyncpg://aiagentx:aiagentx@localhost:5432/aiagentx
          REDIS_URL: redis://localhost:6379/0
          SECRET_KEY: test-secret-key-for-testing-only-do-not-use-in-prod
          APP_ENV: test
        run: |
          pytest tests/integration -v --tb=short -m integration

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install bandit[toml] safety

      - name: Run Bandit (security linter)
        run: |
          bandit -r app -f json -o bandit-report.json || true
          bandit -r app --format txt

      - name: Run Safety (dependency vulnerabilities)
        run: |
          safety check --json --output safety-report.json || true
          safety check

  build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: [lint-and-typecheck, test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        run: |
          docker build -t aiagentx:latest .

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: aiagentx:latest
          format: "table"
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: "os,library"
          severity: "CRITICAL,HIGH"

  notify:
    name: Notify on Failure
    runs-on: ubuntu-latest
    needs: [lint-and-typecheck, test, integration-test, security, build]
    if: failure()
    steps:
      - name: Send failure notification
        run: |
          echo "CI/CD pipeline failed. Check the GitHub Actions logs for details."
          # Add Slack/email notification here if needed